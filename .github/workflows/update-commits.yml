name: Update Project Commits

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-project-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate latest commit data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node src/scripts/generate-project-data.mjs

      - name: Commit updated commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated-project-commits.ts

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "chore: update project commit data"
          git pull --rebase origin main || true
          git push origin HEAD:main
